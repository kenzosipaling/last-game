<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Toko Akun ML</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .price {
      color: green;
      font-weight: 600;
    }

    .buy-btn {
      display: block;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: #25d366;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .buy-btn:hover {
      background: #1ebd57;
    }
  </style>
</head>
<body>

  <h1>🛒 Toko Akun Mobile Legends Ikyy.ID</h1>

  <div class="container">
    <div class="card">
      <img src="img/akunml1.jpg" alt="Akun ML 1">
      <div class="card-content">
        <h3>Epic 100 Skin</h3>
        <div class="price">Rp 150.000</div>
        <a class="buy-btn" href="https://wa.me/62881025138150?text=Halo%20saya%20mau%20beli%20akun%20Epic%20100%20Skin" target="_blank">Beli Sekarang</a>
      </div>
    </div>

    <div class="card">
      <img src="img/akunml2.jpg" alt="Akun ML 2">
      <div class="card-content">
        <h3>Mythic 70 Skin</h3>
        <div class="price">Rp 250.000</div>
        <a class="buy-btn" href="https://wa.me/62881025138150?text=Halo%20saya%20mau%20beli%20akun%20Mythic%2070%20Skin" target="_blank">Beli Sekarang</a>
      </div>
    </div>

    <!-- Tambah lebih banyak card di sini -->
  </div>

</body>
</html>
